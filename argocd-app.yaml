apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monorepo-go-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:xword/go-go-app.git'
    targetRevision: HEAD
    path: 'manifests'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
